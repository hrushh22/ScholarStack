# ScholarStack pipeline configuration.
# Every script reads this file, so results are reproducible from one place.

seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: data/models
  cache: .cache
  figures: reports/figures
  results: reports/results
  web_data: web/data

sources:
  resumes:
    kaggle: snehaanbhawal/resume-dataset
  postings:
    kaggle: arshkon/linkedin-job-postings
  onet:
    version: "31.0"
    url: https://www.onetcenter.org/dl_files/database/db_31_0_text.zip

cleaning:
  min_resume_words: 120
  min_posting_words: 60
  dask_blocksize: 64MB

embedding:
  # Model served live in the browser (transformers.js) — must match the index.
  serving_model: sentence-transformers/all-MiniLM-L6-v2
  browser_model: Xenova/all-MiniLM-L6-v2
  # Models compared in the retrieval experiments.
  candidates:
    - sentence-transformers/all-MiniLM-L6-v2
    - BAAI/bge-small-en-v1.5
    - thenlper/gte-small
  batch_size: 128
  max_seq_length: 256

chunking:
  serving_strategy: section
  section:
    max_words: 160
  fixed:
    window_words: 120
    overlap_words: 30

retrieval:
  k: 8
  # Chosen by pipeline/08_eval_retrieval.py (title + extracted skills beat the raw JD).
  query_variant: skills
  k_sweep: [1, 3, 5, 8, 10, 20]
  onet_top_n: 3

onet:
  min_importance: 3.0         # Essential / transferable skills kept per occupation (1-5 scale)
  min_knowledge_importance: 3.5
  max_tasks: 8
  max_technologies: 25

llm:
  temperature: 0.2
  max_tokens: 4000   # includes reasoning tokens for gpt-oss models

evaluation:
  retrieval_jds_per_category: 10
  generation_jds_per_category: 1
  groundedness_threshold: 0.55
  k_generation_sweep: [3, 8, 15]
